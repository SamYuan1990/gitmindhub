name: Cross-Platform Build

on:
  # 1. 代码推送到 main 分支时触发
  push:
    branches: [ "main" ]
  
  # 2. 提交 PR 到 main 分支时触发
  pull_request:
    branches: [ "main" ]
  
  # 3. 🆕 每日定时触发 (Schedule)
  schedule:
    # POSIX cron 语法: 分 时 日 月 星期
    # 这里设置为 UTC 时间每天 00:00 触发 (即北京时间每天早上 08:00)
    # 如果你想改为北京时间晚上 20:00，可以改成 '0 12 * * *'
    - cron: '0 12 * * *'
  
  # 4. 🆕 允许在 GitHub 页面手动点击按钮触发 (调试 CI 必备)
  workflow_dispatch:

jobs:
  build:
    # 核心改动：使用矩阵策略，定义三个操作系统
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      # 如果其中一个系统打包失败，是否取消其他系统的任务？（建议设为 false，看全貌）
      fail-fast: false 

    # 将 matrix 中的 os 赋值给 runs-on
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Renderer (Vite)
        # ⚠️ 注意：请确保你的 package.json 中有 "build:vite" 这个 script
        # 如果没有，请改为 "npm run build" (根据你之前的配置)
        run: npm run build:vite 

      # 核心改动：根据操作系统动态调整 electron-builder 的打包目标
      - name: Build Electron App
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可以在这里根据 matrix.os 动态设置环境变量，例如：
          # CSC_LINK, CSC_KEY_PASSWORD (用于 Mac 签名，如果有的话)
          CSC_IDENTITY_AUTO_DISCOVERY: false 

      # 核心改动：上传构建产物，方便你直接下载测试
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }} # 产物名字带上系统名，如 build-ubuntu-latest
          path: release/
          retention-days: 1