# Dependabot 配置文件
# 文档参考: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # 配置 npm 生态系统的依赖更新
  - package-ecosystem: "npm"
    directory: "/" # package.json 所在的根目录
    schedule:
      interval: "weekly" # 每周检查一次更新（也可以选 daily 或 monthly）
      day: "monday"      # 固定在每周一检查
      time: "09:00"      # 上午 9 点（UTC 时间）
    
    # 限制同时打开的 PR 数量，避免一次性收到太多更新请求
    open-pull-requests-limit: 10
    
    # 为自动生成的 PR 添加标签，方便在 GitHub 上过滤
    labels:
      - "dependencies"
      - "npm"
      - "automated"
      
    # 提交信息的前缀配置
    commit-message:
      prefix: "chore(deps)"
      
    # 可选：如果你希望更新时自动指派审查人，可以取消下面的注释并填入你的 GitHub 用户名
    # reviewers:
    #   - "your-github-username"
    
    # 可选：如果你希望忽略某些特定包的更新（比如某个包升级后不兼容），可以取消注释
    # ignore:
    #   - dependency-name: "electron"
    #     versions: [">= 29.0.0"]
